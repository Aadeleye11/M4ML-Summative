# Configures the analyzer, which statically checks Dart code for errors,
# warnings, and lints. Issues show up in Dart-enabled IDEs and via
# `flutter analyze` on the command line.

# Activates the recommended lint set for Flutter apps.
include: package:flutter_lints/flutter.yaml

linter:
  # Customize lint rules here: disable rules from flutter.yaml or enable
  # more. See https://dart.dev/lints for the full list. A single line or
  # file can also suppress a lint with `// ignore: name_of_lint` or
  # `// ignore_for_file: name_of_lint`.
  rules:
    # avoid_print: false
    # prefer_single_quotes: true

# See https://dart.dev/guides/language/analysis-options for more.
