name: crop_yield_app
description: "A new Flutter project."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

# Version and build number for the app: major.minor.patch+build.
# Both can be overridden with --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Packages this app depends on.
dependencies:
  flutter:
    sdk: flutter

  # Cupertino (iOS-style) icon font.
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint set; rules configured in analysis_options.yaml.
  flutter_lints: ^6.0.0

# See https://dart.dev/tools/pub/pubspec for general Dart pubspec options.

flutter:
  # Includes the Material Icons font.
  uses-material-design: true

  # To add assets:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # See https://flutter.dev/to/resolution-aware-images and
  # https://flutter.dev/to/asset-from-package for details.

  # To add custom fonts:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  # See https://flutter.dev/to/font-from-package for fonts from packages.
